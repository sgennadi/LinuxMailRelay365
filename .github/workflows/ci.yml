name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # Do not waste runners on superseded commits or duplicate push/PR checks.
  group: linuxmailrelay365-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  linux-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Shell and unit tests
        run: |
          # Compile critical Python entrypoints before launching the 600+ unit
          # tests. A SyntaxError must fail this job immediately.
          python3 -m py_compile linux/manage-multi-mailbox-proof-timer.py linux/refresh-multi-mailbox-proof.py linux/audit-oauth-ingress.py linux/audit-oauth-sender-map.py linux/m365-multi-mailbox-transport.py linux/manage-multi-mailbox-postfix.py linux/restore-multi-mailbox-postfix.py tests/test_multi_mailbox_proof_timer.py tests/test_multi_mailbox_wizard_runtime.py
          # bash -n accepts one script; additional names become positional arguments.
          for script in tests/smoke_native_exim_offline_restore.sh tests/smoke_native_sendmail_backup.sh; do
            bash -n "$script" || exit 1
          done
          bash -n tests/smoke_real_proof_timer_systemd.sh
          # bash -n accepts one script; additional names become positional arguments.
          for script in tests/rocky_vm_sendmail_systemd_enforcing.sh tests/rocky_vm_boot_enforcing.sh tests/rocky_vm_tls_auth_enforcing.sh tests/rocky_vm_isolated_postfix_enforcing.sh tests/rocky_vm_multi_proof_timer_enforcing.sh; do
            bash -n "$script" || exit 1
          done
          python3 -m py_compile tests/rocky_vm_sendmail_stopped_config_restore.py
          python3 -m py_compile tests/rocky_vm_sendmail_stopped_dual_config_restore.py
          python3 -m py_compile linux/foreign-mta-config-backup.py linux/restore-foreign-mta-config.py tests/rocky_vm_sendmail_product_restore.py
          python3 -m unittest discover -v -s tests -p test_sendmail_v2_transaction.py
          python3 -m unittest discover -v -s tests -p test_rocky_vm_sendmail_product_restore.py
          python3 -m py_compile tests/rocky_vm_sendmail_post_reboot_check.py
          # bash -n accepts one script; additional names become positional arguments.
          for script in tests/rocky_vm_isolated_postfix_enforcing.sh tests/rocky_vm_sidecar_installer_guard.sh tests/smoke_rhel_selinux_offline_policy.sh tests/smoke_rhel_native_foreign_mta.sh tests/smoke_native_foreign_mta.sh tests/smoke_authenticated_from_guard_loopback.sh tests/smoke_local_postfix_delivery.sh tests/smoke_fresh_direct_send.sh tests/smoke_fresh_connector.sh tests/smoke_scoped_recovery.sh tests/smoke_scoped_auth_recovery.sh tests/smoke_from_owner_milter.sh linux/install-sidecar-from-guard.sh; do
            bash -n "$script" || exit 1
          done
          bash -n linux/inspect-mail-submission.sh
          # bash -n accepts one script; additional names become positional arguments.
          for script in linux/probe-linux.sh linux/install-postfix-m365-xoauth2.sh linux/mail-config-recovery.sh linux/install-preserve-postfix-sidecar.sh linux/install-direct-send-sidecar.sh linux/install-connector-sidecar.sh linux/network-firewall.sh linux/enable-sidecar-auth-tls.sh linux/restore-sidecar-auth-tls.sh linux/rotate-sidecar-tls.sh linux/install-health-monitor.sh; do
            bash -n "$script" || exit 1
          done
          python3 -m py_compile linux/check-google-smtp.py linux/check-custom-smtp.py
          python3 linux/check-google-smtp.py --self-test
          python3 linux/check-custom-smtp.py --self-test
          python3 -m unittest discover -v -s tests -p test_custom_smtp_probe.py
          python3 -m py_compile linux/manage-google-relay.py linux/manage-custom-relay.py
          python3 linux/manage-google-relay.py --self-test
          python3 linux/manage-custom-relay.py --self-test
          python3 -m unittest discover -v -s tests -p test_custom_postfix_route.py
          python3 -m py_compile linux/prepare-clean-postfix.py linux/inspect-mail-host.py linux/audit-mail-bindings.py
          python3 linux/inspect-mail-host.py --self-test
          python3 -m unittest discover -v -s tests -p test_mail_host_inspect.py
          python3 -m py_compile linux/inspect-mail-queue.py
          python3 -m unittest discover -v -s tests -p test_mail_queue_inspect.py
          python3 -m unittest discover -v -s tests -p test_selected_queue_retry.py
          python3 -m unittest discover -v -s tests -p test_queue_maintenance.py
          python3 -m unittest discover -v -s tests -p test_exim_queue_actions.py
          python3 -m unittest discover -v -s tests -p test_sendmail_queue_inventory.py
          python3 -m unittest discover -v -s tests -p test_sendmail_queue_actions.py
          python3 -m py_compile tests/smoke_native_exim_queue_actions.py
          python3 -m py_compile tests/smoke_native_sendmail_queue_preview.py
          python3 -m py_compile tests/smoke_native_sendmail_queue_execute.py
          python3 -m py_compile tests/smoke_local_postfix_maintenance.py
          python3 linux/audit-mail-bindings.py --self-test
          python3 -W error::DeprecationWarning -m unittest discover -v -s tests -p test_postfix_basics.py
          python3 linux/manage-postfix-basics.py --self-test
          python3 -m unittest discover -v -s tests -p test_clean_postfix_bootstrap.py
          python3 -m py_compile linux/audit-existing-smtp.py linux/manage-rhel-selinux-port.py linux/manage-public-smtp.py linux/manage-health-alerts.py linux/audit-m365-dns.py
          python3 -m py_compile linux/sidecar-from-owner-milter.py
          python3 -m py_compile linux/manage-tpm-dependencies.py tests/smoke_local_postfix_sink.py tests/smoke_authenticated_from_guard_loopback.py
          python3 -m unittest discover -v -s tests -p test_authenticated_from_guard_loopback.py
          python3 -m unittest discover -v -s tests -p test_local_postfix_sink.py
          python3 -m unittest discover -v -s tests -p test_tpm_dependencies.py
          python3 -m py_compile linux/verify-hardware-oauth.py
          python3 -m unittest discover -v -s tests -p test_verify_hardware_oauth.py
          python3 -m py_compile linux/manage-hardware-oauth-cutover.py
          python3 -m unittest discover -v -s tests -p test_hardware_oauth_cutover.py
          python3 -m unittest discover -v -s tests -p test_hardware_oauth_stage.py
          python3 -m py_compile linux/manage-tpm-oauth-key.py
          python3 -m unittest discover -v -s tests -p test_tpm_oauth_key.py
          python3 -m py_compile linux/manage-primary-oauth-rotation.py
          python3 -m unittest discover -v -s tests -p test_primary_oauth_rotation.py
          python3 -m unittest discover -v -s tests -p test_primary_mailbox_route_preview.py
          python3 -m py_compile linux/primary-mailbox-transaction.py
          python3 -m unittest discover -v -s tests -p test_primary_mailbox_transaction.py
          python3 -m py_compile linux/primary-mailbox-runtime.py linux/manage-primary-mailbox-offline.py
          python3 -m unittest discover -v -s tests -p test_primary_mailbox_runtime.py
          python3 -m unittest discover -v -s tests -p test_primary_pipe_vm_fixture.py
          python3 -m unittest discover -v -s tests -p test_primary_tpm_broker_protocol.py
          python3 -m unittest discover -v -s tests -p test_primary_tpm_broker_identity.py
          python3 -m unittest discover -v -s tests -p test_primary_tpm_broker_service.py
          python3 -m unittest discover -v -s tests -p test_primary_xoauth2_installer_selinux.py
          python3 -m py_compile linux/export-hardware-oauth-cert.py
          python3 -m unittest discover -v -s tests -p test_entra_public_oauth_certificate.py
          python3 -m py_compile linux/audit-oauth-sender-map.py
          python3 -m unittest discover -v -s tests -p test_oauth_sender_map.py
          python3 -m py_compile linux/audit-oauth-ingress.py
          python3 -m unittest discover -v -s tests -p test_oauth_ingress.py
          python3 -m py_compile linux/m365_xoauth2_transport.py linux/manage-m365-delivery-acceptance.py
          python3 -m unittest discover -v -s tests -p test_m365_delivery_acceptance.py
          python3 linux/sidecar-from-owner-milter.py --self-test
          python3 -m unittest discover -v -s tests -p test_sidecar_from_owner_milter.py
          python3 -m unittest discover -v -s tests
          # Real root-owned temporary map transaction; not a production spool.
          sudo env GITHUB_ACTIONS=true RUNNER_ENVIRONMENT=github-hosted python3 -m unittest discover -v -s tests -p test_multi_mailbox_source_editor.py
          sudo env GITHUB_ACTIONS=true RUNNER_ENVIRONMENT=github-hosted python3 -m unittest discover -v -s tests -p test_multi_mailbox_postfix_installer.py
          sudo env GITHUB_ACTIONS=true RUNNER_ENVIRONMENT=github-hosted python3 -m unittest discover -v -s tests -p test_multi_mailbox_identity_prepare.py
          sudo env GITHUB_ACTIONS=true RUNNER_ENVIRONMENT=github-hosted python3 -m unittest discover -v -s tests -p test_multi_mailbox_new_app.py
          sudo env GITHUB_ACTIONS=true RUNNER_ENVIRONMENT=github-hosted python3 -m unittest discover -v -s tests -p test_multi_mailbox_graph_pair.py
          python3 -m unittest discover -v -s tests -p test_signed_release_gate.py
          python3 linux/mta-coexistence-doctor.py --self-test
          python3 linux/guard-foreign-mta.py --self-test
          python3 -m py_compile linux/guard-foreign-mta.py
          python3 -m unittest discover -v -s tests -p test_foreign_mta_preservation.py
          python3 linux/recovery-scope-audit.py --self-test
          python3 -m py_compile linux/sidecar-config-recovery.py
          python3 linux/sidecar-config-recovery.py --self-test
          # Deprecated UTC/time code must fail rather than be hidden.
          python3 -W error::DeprecationWarning -m unittest discover -v -s tests -p test_sidecar_config_recovery.py
          python3 linux/generate-smtp-client-credential.py --self-test
          python3 linux/rhel-enforcing-live-smoke.py --self-test
          python3 linux/verify-sidecar-auth-client.py --self-test
          python3 -m py_compile linux/verify-sidecar-envelope.py
          python3 linux/verify-sidecar-envelope.py --self-test
          python3 -m unittest discover -v -s tests -p test_sidecar_envelope.py
  ubuntu-real-proof-timer-systemd:
    # CI-only disposable Ubuntu host: inert systemd timer/service, no SMTP.
    # Verifies real LoadState/FragmentPath/NeedDaemonReload and cleanup.
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - name: Exercise genuine systemd proof timer state transitions
        shell: bash
        run: |
          set -euo pipefail
          bash -n tests/smoke_real_proof_timer_systemd.sh
          sudo env GITHUB_ACTIONS="${GITHUB_ACTIONS}" \
            RUNNER_ENVIRONMENT="${RUNNER_ENVIRONMENT}" \
            RUNNER_TEMP="${RUNNER_TEMP}" \
            bash tests/smoke_real_proof_timer_systemd.sh

  ubuntu-clean-postfix-bootstrap:
    # Disposable runner: exercises real apt/dpkg/systemd, but never sends mail
    # and never runs against a user-managed Linux server.
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v5
      - name: Install Postfix on clean Ubuntu, primary MTA disabled and TCP25 free
        shell: bash
        run: |
          set -euo pipefail
          python3 linux/prepare-clean-postfix.py --check-only --smtp-port 25 > /tmp/lmr365-clean-preview
          cat /tmp/lmr365-clean-preview
          grep -Fxq 'CLEAN_POSTFIX_BOOTSTRAP_READY=yes' /tmp/lmr365-clean-preview
          plan="$(sed -n 's/^CLEAN_POSTFIX_PLAN_SHA256=//p' /tmp/lmr365-clean-preview)"
          [[ "$plan" =~ ^[a-f0-9]{64}$ ]]
          sudo python3 linux/prepare-clean-postfix.py --apply --smtp-port 25 \
            --expected-plan-sha256 "$plan" --confirm INSTALL_CLEAN_POSTFIX_PACKAGES \
            > /tmp/lmr365-clean-result
          grep -Fxq 'CLEAN_POSTFIX_PACKAGES_PREPARED=yes' /tmp/lmr365-clean-result
          grep -Fxq 'PRIMARY_POSTFIX_SERVICE=disabled' /tmp/lmr365-clean-result
          sudo python3 linux/prepare-clean-postfix.py --verify-prepared --smtp-port 25 \
            > /tmp/lmr365-clean-verify
          grep -Fxq 'CLEAN_POSTFIX_PREPARED_VERIFIED=yes' /tmp/lmr365-clean-verify
          grep -Fxq 'POSTFIX_PRIMARY_STARTED=no' /tmp/lmr365-clean-verify
          test "$(systemctl is-active postfix.service 2>/dev/null || true)" != active
          ! ss -H -lnt | grep -E ':(25|465|587|25)[[:space:]]'
          echo 'CLEAN_POSTFIX_UBUNTU_PACKAGE_BOOTSTRAP=passed_real_systemd'
      - name: Install isolated Direct Send on TCP25 without starting primary Postfix
        shell: bash
        run: |
          set -euo pipefail
          sudo bash linux/install-direct-send-sidecar.sh --apply \
            --smtp-port 25 \
            --mx-host example-org.mail.protection.outlook.com \
            --accepted-domain example.org --fixed-sender alerts@example.org \
            --confirm-accepted-domain TENANT_DOMAIN_CHECKED \
            > /tmp/lmr365-clean-isolated
          grep -Fxq 'DIRECT_SEND_SIDECAR_INSTALLED=yes' /tmp/lmr365-clean-isolated
          grep -Fxq 'PRIMARY_POSTFIX_CONFIG_UNCHANGED=yes' /tmp/lmr365-clean-isolated
          systemctl is-active --quiet linuxmailrelay365-sidecar.service
          test "$(systemctl is-active postfix.service 2>/dev/null || true)" != active
          ss -H -lnt | grep -E '127[.]0[.]0[.]1:25[[:space:]]'
          ! ss -H -lnt | grep -E ':(465|587|2525)[[:space:]]'
          # The clean bootstrap marker is no longer authority to install a
          # second gateway once port 25 has become a live SMTP listener.
          if sudo python3 linux/prepare-clean-postfix.py --verify-prepared --smtp-port 25 \
              > /tmp/lmr365-replay 2>&1; then
            echo 'ERROR: clean-bootstrap marker could be reused after sidecar install' >&2
            exit 1
          fi
          echo 'CLEAN_POSTFIX_TO_ISOLATED_DIRECT_SEND_PORT25=passed_no_messages_sent'

  ubuntu-native-foreign-mta-smoke:
    # Actual Debian-packaged Exim and Sendmail CLI checks on separate
    # disposable runners; no SMTP delivery, tenant, or existing mail data.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        mta: [exim, sendmail]
    steps:
      - uses: actions/checkout@v5
      - name: Install native MTA with service startup disabled; prove read-only syntax gate
        shell: bash
        run: bash tests/smoke_native_foreign_mta.sh "${{ matrix.mta }}"
      - name: Exercise guarded Exim offline config restore without sending mail
        if: matrix.mta == 'exim'
        shell: bash
        run: bash tests/smoke_native_exim_offline_restore.sh
      - name: Verify selected Exim Freeze and Thaw on one queue-only synthetic message
        if: matrix.mta == 'exim'
        run: sudo env GITHUB_ACTIONS="$GITHUB_ACTIONS" RUNNER_TEMP="$RUNNER_TEMP" python3 tests/smoke_native_exim_queue_actions.py
      - name: Verify packaged Sendmail read-only backup without mail delivery
        if: matrix.mta == 'sendmail'
        shell: bash
        run: bash tests/smoke_native_sendmail_backup.sh
      - name: Verify native Sendmail queue previews and refused approvals
        if: matrix.mta == 'sendmail'
        shell: bash
        run: |
          sudo env GITHUB_ACTIONS="$GITHUB_ACTIONS" RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" RUNNER_TEMP="$RUNNER_TEMP" \
            unshare --mount --net --propagation private \
            python3 tests/smoke_native_sendmail_queue_preview.py
      - name: Verify real Sendmail Retry and Flush in isolated native MTA and MSP queues
        if: matrix.mta == 'sendmail'
        shell: bash
        run: |
          for queue in mta msp; do
            for action in retry flush; do
              sudo env GITHUB_ACTIONS="$GITHUB_ACTIONS" RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" RUNNER_TEMP="$RUNNER_TEMP" \
                unshare --mount --net --propagation private \
                python3 tests/smoke_native_sendmail_queue_execute.py "$queue" "$action"
            done
          done

  rc14-native-transaction-fast:
    # Independent fresh package fixture; does not replace the full sidecar smoke.
    if: >-
      contains(github.ref, 'rc14-postfix-map-inventory') ||
      github.event.pull_request.head.ref == 'feature/rc14-postfix-map-inventory' ||
      github.ref == 'refs/heads/feature/rc14-transport-transaction' ||
      github.event.pull_request.head.ref == 'feature/rc14-transport-transaction' ||
      github.ref == 'refs/heads/feature/post-rc14-selinux-integration' ||
      github.event.pull_request.head.ref == 'feature/post-rc14-selinux-integration' ||
      github.ref == 'refs/heads/feature/rc15-ui-test-release' ||
      github.event.pull_request.head.ref == 'feature/rc15-ui-test-release' ||
      github.ref == 'refs/heads/feature/post-rc15-wizard-refinement' ||
      github.event.pull_request.head.ref == 'feature/post-rc15-wizard-refinement' ||
      github.ref == 'refs/heads/feature/post-rc16-native-recovery' ||
      github.event.pull_request.head.ref == 'feature/post-rc16-native-recovery' ||
      github.ref == 'refs/heads/feature/post-rc17-sendmail-v2' ||
      github.event.pull_request.head.ref == 'feature/post-rc17-sendmail-v2' ||
      github.ref == 'refs/heads/release/v0.1.1-rc.19' ||
      github.event.pull_request.head.ref == 'release/v0.1.1-rc.19'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - name: Install packaged Postfix for isolated transaction
        run: |
          sudo apt-get update -qq
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y postfix
      - name: Native isolated transaction and rollback
        run: sudo env GITHUB_ACTIONS="$GITHUB_ACTIONS" python3 tests/smoke_native_conditional_transaction.py

  ubuntu-postfix-smoke:
    # Test both production LTS Dovecot 2.3 and updated Dovecot 2.4 grammar.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - name: Real isolated Postfix service and primary mail preservation smoke
        run: bash tests/smoke_isolated_postfix.sh
      - name: Compile and query real isolated conditional Postfix maps
        run: sudo env GITHUB_ACTIONS="$GITHUB_ACTIONS" python3 tests/smoke_native_conditional_maps.py
      - name: Native isolated sender-map transaction, restore and rollback
        run: sudo env GITHUB_ACTIONS="$GITHUB_ACTIONS" python3 tests/smoke_native_conditional_transaction.py
      - name: Native dedicated SMTP services and separate private AUTH maps
        run: sudo env GITHUB_ACTIONS="$GITHUB_ACTIONS" python3 tests/smoke_native_conditional_transports.py

  ubuntu-fresh-direct-send-smoke:
    # Clean system: no Entra app or OAuth cert; one synthetic DATA goes to local sink only.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - name: Install clean isolated Direct Send and verify SMTP RCPT restrictions
        run: bash tests/smoke_fresh_direct_send.sh

  ubuntu-fresh-connector-smoke:
    # Real isolated Postfix with custom inbound port, no OAuth identity or M365 mail.
    # Tests RCPT policy plus one synthetic queue-to-loopback DATA message only.
    # Does NOT validate Microsoft 365 tenant Connector or Exchange delivery.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - name: Install fresh isolated fixed-sender Connector and verify private relay
        run: bash tests/smoke_fresh_connector.sh

  rhel-selinux-offline-policy-smoke:
    # Genuine SELinux targeted policy packages, NOT host kernel Enforcing.
    # Never mount selinuxfs or run setenforce in CI containers.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        image:
          - rockylinux:8
          - rockylinux:9
          - rockylinux:10
          - almalinux:9
          - oraclelinux:9
          - oraclelinux:10
    container:
      image: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v5
      - name: Verify actual offline SELinux policy, SMTP types and fail-closed Enforcing gates
        shell: bash
        run: bash tests/smoke_rhel_selinux_offline_policy.sh

  rhel-native-foreign-mta-smoke:
    # Actual RPM Exim/Sendmail in disposable EL containers, NOT RHEL
    # subscription, systemd, physical TPM or SELinux Enforcing acceptance.
    runs-on: ubuntu-latest
    timeout-minutes: 22
    strategy:
      fail-fast: false
      matrix:
        include:
          - {image: rockylinux:8, mta: exim}
          - {image: rockylinux:8, mta: sendmail}
          - {image: rockylinux:9, mta: exim}
          - {image: rockylinux:9, mta: sendmail}
          - {image: almalinux:9, mta: sendmail}
          - {image: oraclelinux:9, mta: sendmail}
    container:
      image: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v5
      - name: Check real native MTA parser without daemon or mail delivery
        shell: bash
        run: bash tests/smoke_rhel_native_foreign_mta.sh "${{ matrix.mta }}"

  rhel-native-sendmail-queues:
    # Package-native submissions and class transitions in a disposable
    # network-disabled image. Not a live SELinux/systemd acceptance test.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        image: [rockylinux:8, rockylinux:9, almalinux:9, oraclelinux:9]
    steps:
      - uses: actions/checkout@v5
      - name: Build disposable native Sendmail package image
        shell: bash
        env:
          BASE_IMAGE: ${{ matrix.image }}
        run: |
          set -Eeuo pipefail
          case "$BASE_IMAGE" in
            rockylinux:8|rockylinux:9|almalinux:9|oraclelinux:9) ;;
            *) exit 2 ;;
          esac
          context="$(mktemp -d)"
          trap 'rm -rf -- "$context"' EXIT
          mkdir -p "$context/linux" "$context/tests"
          cp linux/inspect-mail-queue.py "$context/linux/"
          cp tests/smoke_native_sendmail_queue_preview.py "$context/tests/"
          cat > "$context/Dockerfile" <<'DOCKER'
          ARG BASE_IMAGE
          FROM ${BASE_IMAGE}
          RUN dnf -y install python3 hostname sendmail systemd && dnf clean all
          # EL9 image-mode RPMs declare ghost spool directories and service
          # users; the systemd boot initialization never runs in Docker.
          # Use only the installed package's own initialization definitions.
          RUN set -eu; \
              if test -f /usr/lib/sysusers.d/sendmail.conf; then \
                systemd-sysusers /usr/lib/sysusers.d/sendmail.conf; \
              fi; \
              if test -f /usr/lib/tmpfiles.d/sendmail.conf; then \
                systemd-tmpfiles --create /usr/lib/tmpfiles.d/sendmail.conf; \
              fi; \
              rpm -q sendmail; \
              test -d /var/spool/mqueue; \
              test -d /var/spool/clientmqueue; \
              stat -c 'EL_SENDMAIL_PACKAGE_SPOOL=%n:%U:%G:%a' /var/spool/mqueue /var/spool/clientmqueue
          COPY linux/inspect-mail-queue.py /opt/lmr365/linux/inspect-mail-queue.py
          COPY tests/smoke_native_sendmail_queue_preview.py /opt/lmr365/tests/smoke_native_sendmail_queue_preview.py
          DOCKER
          docker build --build-arg BASE_IMAGE="$BASE_IMAGE" -t lmr365-native-sendmail-ci:local "$context"
      - name: Verify native MTA/MSP plans, quarantine and release without network
        shell: bash
        run: |
          docker run --rm --network none --hostname lmr365-fixture.ci.localdomain \
            --add-host lmr365-fixture.ci.localdomain:127.0.0.1 \
            --add-host lmr365-fixture:127.0.0.1 \
            --cap-drop NET_RAW --cap-drop NET_ADMIN \
            -e GITHUB_ACTIONS=true -e RUNNER_ENVIRONMENT=github-hosted \
            -e RUNNER_TEMP=/tmp -e LMR365_CI_DISPOSABLE_CONTAINER=1 \
            --entrypoint /usr/bin/python3 lmr365-native-sendmail-ci:local \
            /opt/lmr365/tests/smoke_native_sendmail_queue_preview.py

