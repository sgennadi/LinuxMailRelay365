name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # Do not waste runners on superseded commits or duplicate push/PR checks.
  group: linuxmailrelay365-${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  linux-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Shell and unit tests
        run: |
          bash -n tests/smoke_local_postfix_delivery.sh tests/smoke_fresh_direct_send.sh tests/smoke_fresh_connector.sh tests/smoke_scoped_recovery.sh tests/smoke_scoped_auth_recovery.sh tests/smoke_from_owner_milter.sh linux/install-sidecar-from-guard.sh
          bash -n linux/probe-linux.sh linux/install-postfix-m365-xoauth2.sh linux/mail-config-recovery.sh linux/install-preserve-postfix-sidecar.sh linux/install-direct-send-sidecar.sh linux/install-connector-sidecar.sh linux/network-firewall.sh linux/enable-sidecar-auth-tls.sh linux/restore-sidecar-auth-tls.sh linux/rotate-sidecar-tls.sh linux/install-health-monitor.sh
          python3 -m py_compile linux/audit-existing-smtp.py linux/manage-rhel-selinux-port.py linux/manage-public-smtp.py linux/manage-health-alerts.py linux/audit-m365-dns.py
          python3 -m py_compile linux/sidecar-from-owner-milter.py
          python3 -m py_compile linux/manage-tpm-dependencies.py tests/smoke_local_postfix_sink.py
          python3 -m unittest discover -v -s tests -p test_local_postfix_sink.py
          python3 -m unittest discover -v -s tests -p test_tpm_dependencies.py
          python3 -m py_compile linux/verify-hardware-oauth.py
          python3 -m unittest discover -v -s tests -p test_verify_hardware_oauth.py
          python3 -m py_compile linux/manage-hardware-oauth-cutover.py
          python3 -m unittest discover -v -s tests -p test_hardware_oauth_cutover.py
          python3 -m unittest discover -v -s tests -p test_hardware_oauth_stage.py
          python3 -m py_compile linux/manage-tpm-oauth-key.py
          python3 -m unittest discover -v -s tests -p test_tpm_oauth_key.py
          python3 -m py_compile linux/export-hardware-oauth-cert.py
          python3 -m unittest discover -v -s tests -p test_entra_public_oauth_certificate.py
          python3 -m py_compile linux/audit-oauth-sender-map.py
          python3 -m unittest discover -v -s tests -p test_oauth_sender_map.py
          python3 -m py_compile linux/m365_xoauth2_transport.py linux/manage-m365-delivery-acceptance.py
          python3 -m unittest discover -v -s tests -p test_m365_delivery_acceptance.py
          python3 linux/sidecar-from-owner-milter.py --self-test
          python3 -m unittest discover -v -s tests -p test_sidecar_from_owner_milter.py
          python3 -m unittest discover -v -s tests
          python3 -m unittest discover -v -s tests -p test_signed_release_gate.py
          python3 linux/mta-coexistence-doctor.py --self-test
          python3 linux/guard-foreign-mta.py --self-test
          python3 -m py_compile linux/guard-foreign-mta.py
          python3 -m unittest discover -v -s tests -p test_foreign_mta_preservation.py
          python3 linux/recovery-scope-audit.py --self-test
          python3 -m py_compile linux/sidecar-config-recovery.py
          python3 linux/sidecar-config-recovery.py --self-test
          python3 -m unittest discover -v -s tests -p test_sidecar_config_recovery.py
          python3 linux/generate-smtp-client-credential.py --self-test
          python3 linux/rhel-enforcing-live-smoke.py --self-test
          python3 linux/verify-sidecar-auth-client.py --self-test
          python3 -m py_compile linux/verify-sidecar-envelope.py
          python3 linux/verify-sidecar-envelope.py --self-test
          python3 -m unittest discover -v -s tests -p test_sidecar_envelope.py
  ubuntu-postfix-smoke:
    # Test both production LTS Dovecot 2.3 and updated Dovecot 2.4 grammar.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - name: Real isolated Postfix service and primary mail preservation smoke
        run: bash tests/smoke_isolated_postfix.sh

  ubuntu-fresh-direct-send-smoke:
    # Clean system: no Entra app or OAuth cert; one synthetic DATA goes to local sink only.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - name: Install clean isolated Direct Send and verify SMTP RCPT restrictions
        run: bash tests/smoke_fresh_direct_send.sh

  ubuntu-fresh-connector-smoke:
    # Real isolated Postfix with custom inbound port, no OAuth identity or M365 mail.
    # Tests RCPT policy plus one synthetic queue-to-loopback DATA message only.
    # Does NOT validate Microsoft 365 tenant Connector or Exchange delivery.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - name: Install fresh isolated fixed-sender Connector and verify private relay
        run: bash tests/smoke_fresh_connector.sh

  rhel-family-readonly-smoke:
    # Container-only validation. Not a full systemd/Postfix/SELinux integration test.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - rockylinux:8
          - rockylinux:9
          - rockylinux:10
          - almalinux:8
          - almalinux:9
          - almalinux:10
          - oraclelinux:8
          - oraclelinux:9
          - oraclelinux:10
    container:
      image: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v5
      - name: Install distribution Python
        shell: bash
        run: |
          dnf -y install python3
      - name: Verify real OS identification and custom port
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 linux/platform-compat.py --smtp-port 2526 | tee /tmp/lmr365-platform.log
          python3 -m unittest discover -v -s tests -p test_tpm_dependencies.py
          python3 -m py_compile linux/verify-hardware-oauth.py
          python3 -m unittest discover -v -s tests -p test_verify_hardware_oauth.py
          python3 -m py_compile linux/manage-hardware-oauth-cutover.py
          python3 -m unittest discover -v -s tests -p test_hardware_oauth_cutover.py
          python3 -m unittest discover -v -s tests -p test_hardware_oauth_stage.py
          python3 -m py_compile linux/manage-tpm-oauth-key.py
          python3 -m unittest discover -v -s tests -p test_tpm_oauth_key.py
          python3 -m py_compile linux/export-hardware-oauth-cert.py
          python3 -m unittest discover -v -s tests -p test_entra_public_oauth_certificate.py
          python3 -m py_compile linux/m365_xoauth2_transport.py linux/manage-m365-delivery-acceptance.py
          python3 -m py_compile linux/audit-oauth-sender-map.py
          python3 -m unittest discover -v -s tests -p test_oauth_sender_map.py
          python3 -m unittest discover -v -s tests -p test_m365_delivery_acceptance.py
          grep -Fx 'OS_FAMILY=rhel' /tmp/lmr365-platform.log
          grep -Fx 'SMTP_PORT=2526' /tmp/lmr365-platform.log
          grep -Fx 'CHANGES_APPLIED=no' /tmp/lmr365-platform.log
          bash -n linux/enable-sidecar-auth-tls.sh
          bash -n linux/restore-sidecar-auth-tls.sh
          bash linux/restore-sidecar-auth-tls.sh --self-test
          python3 -m unittest discover -v -s tests -p test_sidecar_auth_restore.py
          python3 -m unittest discover -v -s tests -p test_sidecar_auth_archives.py
          bash linux/enable-sidecar-auth-tls.sh --self-test
          python3 -m unittest discover -v -s tests -p test_private_auth_tls.py
          python3 -m unittest discover -v -s tests -p test_installed_sidecar_audit.py
          python3 -m unittest discover -v -s tests -p test_rhel_selinux_doctor.py
          python3 -m unittest discover -v -s tests -p test_rhel_enforcing_live_smoke.py
          python3 linux/rhel-enforcing-live-smoke.py --self-test
          python3 linux/verify-sidecar-auth-client.py --self-test
          python3 -m py_compile linux/verify-sidecar-envelope.py
          python3 linux/verify-sidecar-envelope.py --self-test
          python3 -m unittest discover -v -s tests -p test_sidecar_envelope.py
          python3 -m unittest discover -v -s tests -p test_sidecar_auth_client.py
          python3 -m unittest discover -v -s tests -p test_rhel_selinux_port_manager.py
          python3 -m unittest discover -v -s tests -p test_public_smtp_manager.py
          python3 -m unittest discover -v -s tests -p test_health_alerts.py
          python3 -m unittest discover -v -s tests -p test_m365_dns_audit.py
          python3 linux/audit-m365-dns.py --self-test
          python3 linux/manage-health-alerts.py --self-test
          python3 linux/manage-public-smtp.py --self-test --smtp-port 46500
          python3 linux/manage-rhel-selinux-port.py --self-test
          python3 -m unittest discover -v -s tests -p test_sidecar_smtp_accounts.py
          python3 -m unittest discover -v -s tests -p test_smtp_credential_generator.py
          python3 linux/generate-smtp-client-credential.py --self-test
          python3 -m unittest discover -v -s tests -p test_relay_health.py
          python3 -m unittest discover -v -s tests -p test_m365_outbound_preflight.py
          python3 -m unittest discover -v -s tests -p test_sidecar_eop_route.py
          bash -n linux/install-direct-send-sidecar.sh
          bash linux/install-direct-send-sidecar.sh --self-test
          bash -n linux/install-connector-sidecar.sh
          bash linux/install-connector-sidecar.sh --self-test
          python3 -m unittest discover -v -s tests -p test_standalone_connector.py
          python3 -m unittest discover -v -s tests -p test_standalone_direct_send.py
          bash -n linux/rotate-sidecar-tls.sh
          bash linux/rotate-sidecar-tls.sh --self-test
          python3 -m unittest discover -v -s tests -p test_sidecar_tls_rotation.py
          bash -n linux/install-health-monitor.sh
          bash linux/install-health-monitor.sh --self-test
          python3 -m unittest discover -v -s tests -p test_health_monitor.py
          python3 -m unittest discover -v -s tests -p test_reboot_continuity.py
          python3 linux/verify-reboot-continuity.py --verify-after-reboot --smtp-port 46500 || test $? -eq 2
          python3 linux/m365-outbound-mode-preflight.py --mode direct-send --smtp-port 46500 --mx-host demo-com.mail.protection.outlook.com --accepted-domain demo.com | grep -Fx 'CHANGES_APPLIED=no'
          python3 linux/relay-health.py --smtp-port 46500 | grep -Fx 'CHANGES_APPLIED=no'
          python3 linux/rhel-selinux-doctor.py --smtp-port 46500 | grep -Fx 'CHANGES_APPLIED=no'
          python3 -m unittest discover -v -s tests -p test_tls_identity.py
          python3 linux/verify-sidecar-tls-identity.py --validate-only --smtp-port 46500 --server-name smtp.example.org | grep -Fx 'CHANGES_APPLIED=no'
          python3 linux/installed-sidecar-audit.py --smtp-port 46500 --no-live-probe | grep -Fx 'CHANGES_APPLIED=no'
          python3 -m py_compile linux/mta-coexistence-doctor.py linux/generate-smtp-client-credential.py linux/rhel-enforcing-live-smoke.py linux/audit-m365-dns.py linux/manage-health-alerts.py linux/manage-public-smtp.py linux/manage-rhel-selinux-port.py linux/platform-compat.py linux/m365_xoauth2_transport.py linux/audit-existing-smtp.py linux/installed-sidecar-audit.py linux/audit-sidecar-auth-archives.py linux/rhel-selinux-doctor.py linux/manage-sidecar-smtp-accounts.py linux/relay-health.py linux/m365-outbound-mode-preflight.py linux/manage-sidecar-eop-route.py linux/verify-reboot-continuity.py linux/verify-sidecar-tls-identity.py
          python3 linux/m365_xoauth2_transport.py --help >/dev/null
          bash linux/install-preserve-postfix-sidecar.sh --check-only --smtp-port 46500 --listen-ip 192.168.40.2 --trusted-network 192.168.40.0/24
          bash linux/network-firewall.sh --validate-only --smtp-port 46500 --listen-ip 192.168.40.2 --trusted-network 192.168.40.0/24
          bash linux/install-postfix-m365-xoauth2.sh --validate-network-only --listen-ip 192.168.40.2 --trusted-network 192.168.40.0/24
          python3 -m unittest discover -v -s tests -p test_recovery_confirmation.py
          python3 -m unittest discover -v -s tests -p test_existing_mta_audit.py
          python3 -m unittest discover -v -s tests -p test_mta_coexistence_doctor.py
          python3 -m unittest discover -v -s tests -p test_foreign_mta_preservation.py
          python3 -m py_compile linux/guard-foreign-mta.py
          python3 linux/guard-foreign-mta.py --self-test
          python3 linux/mta-coexistence-doctor.py --self-test
          python3 -m unittest discover -v -s tests -p test_recovery_scope_audit.py
          python3 -m py_compile linux/sidecar-config-recovery.py
          python3 linux/sidecar-config-recovery.py --self-test
          python3 -m unittest discover -v -s tests -p test_sidecar_config_recovery.py
          python3 linux/recovery-scope-audit.py --self-test
          python3 linux/recovery-scope-audit.py --smtp-port 46500 | grep -Fx 'CHANGES_APPLIED=no'
          python3 -m unittest discover -v -s tests -p test_platform_compat.py

  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Microsoft 365 Connector/Direct Send read-only audit self-test
        shell: pwsh
        run: |
          ./windows/Test-LinuxMailRelay365OutboundMode.ps1 -SelfTest
          ./windows/Manage-LinuxMailRelay365Connector.ps1 -SelfTest
          ./windows/Manage-LinuxMailRelay365EntraCertificate.ps1 -SelfTest
          ./scripts/Test-LinuxMailRelay365SignedRelease.ps1 -SelfTest
      - name: Build portable single EXE x64
        shell: pwsh
        run: dotnet publish src/LinuxMailRelay365/LinuxMailRelay365.csproj -c Release -r win-x64 --self-contained true -p:UseSharedUpdater=false -o out/win-x64
      - name: Windows self-test
        shell: pwsh
        run: |
          # GUI-subsystem EXE must be explicitly waited for; `& exe`
          # does not always set $LASTEXITCODE on Windows.
          $binary = (Resolve-Path ./out/win-x64/LinuxMailRelay365.exe).Path
          $report = Join-Path (Get-Location) 'out/win-x64/selftest-results.txt'
          $testProcess = Start-Process -FilePath $binary -ArgumentList @('--self-test', '--report', $report) -Wait -PassThru
          if (Test-Path -LiteralPath $report) { Get-Content -LiteralPath $report }
          if ($testProcess.ExitCode -ne 0) { throw "Windows self-test failed with exit code $($testProcess.ExitCode)." }
          $files = @(Get-ChildItem ./out/win-x64 -Filter '*.exe')
          if ($files.Count -ne 1) { throw 'Expected exactly one EXE in publish output.' }
      - name: Capture actual Windows Wizard and early-route screens (CI-only)
        shell: pwsh
        timeout-minutes: 3
        run: |
          $exe = (Resolve-Path ./out/win-x64/LinuxMailRelay365.exe).Path
          $folder = Join-Path (Get-Location) 'out/wizard-screenshots'
          New-Item -ItemType Directory -Force -Path $folder | Out-Null
          $result = Start-Process -FilePath $exe -ArgumentList @('--capture-wizard-screens', ('"{0}"' -f $folder)) -Wait -PassThru
          if ($result.ExitCode -ne 0) { throw "Wizard screenshot capture failed: exit $($result.ExitCode)" }
          $images = @(Get-ChildItem -LiteralPath $folder -Filter '*.png')
          if ($images.Count -ne 9) { throw "Expected 9 real Wizard PNG screens; found $($images.Count)" }
          foreach ($image in $images) {
            if ($image.Length -lt 3000) { throw "Empty or invalid screen PNG: $($image.Name)" }
          }
          Write-Host 'ACTUAL_WINDOWS_WIZARD_SCREENS=9'
          Write-Host 'SMTP_TENANT_CONNECTIONS_ATTEMPTED=no'
      - name: Upload actual Wizard screenshots (no production host or tenant)
        uses: actions/upload-artifact@v6
        with:
          name: LinuxMailRelay365-actual-wizard-screenshots
          path: out/wizard-screenshots/
          if-no-files-found: error
      - name: Build portable single EXE ARM64
        shell: pwsh
        run: dotnet publish src/LinuxMailRelay365/LinuxMailRelay365.csproj -c Release -r win-arm64 --self-contained true -p:UseSharedUpdater=false -o out/win-arm64
      - name: Generate SHA256 manifest for both unsigned preview executables
        shell: pwsh
        run: |
          $x64 = (Get-FileHash -Algorithm SHA256 ./out/win-x64/LinuxMailRelay365.exe).Hash.ToLowerInvariant()
          $arm64 = (Get-FileHash -Algorithm SHA256 ./out/win-arm64/LinuxMailRelay365.exe).Hash.ToLowerInvariant()
          @(
            "win-x64 LinuxMailRelay365.exe sha256:$x64",
            "win-arm64 LinuxMailRelay365.exe sha256:$arm64",
            "STATUS=preview_unsigned_not_for_production"
          ) | Set-Content -Path ./out/preview-artifact-digests.txt -Encoding utf8
      - name: Upload preview build (not a stable release)
        uses: actions/upload-artifact@v6
        with:
          name: LinuxMailRelay365-preview-builds
          path: |
            out/win-x64/LinuxMailRelay365.exe
            out/win-arm64/LinuxMailRelay365.exe
            out/preview-artifact-digests.txt
          if-no-files-found: error
