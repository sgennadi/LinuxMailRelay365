name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Shell and unit tests
        run: |
          bash -n linux/probe-linux.sh linux/install-postfix-m365-xoauth2.sh linux/mail-config-recovery.sh linux/install-preserve-postfix-sidecar.sh linux/network-firewall.sh
          python3 -m py_compile linux/audit-existing-smtp.py
          python3 -m unittest discover -v -s tests
  ubuntu-postfix-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - name: Real isolated Postfix service and primary mail preservation smoke
        run: bash tests/smoke_isolated_postfix.sh

  rhel-family-readonly-smoke:
    # Container-only validation. Not a full systemd/Postfix/SELinux integration test.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - rockylinux:8
          - rockylinux:9
          - rockylinux:10
          - almalinux:9
          - oraclelinux:9
          - oraclelinux:10
    container:
      image: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v5
      - name: Install distribution Python
        shell: bash
        run: |
          dnf -y install python3
      - name: Verify real OS identification and custom port
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 linux/platform-compat.py --smtp-port 2526 | tee /tmp/lmr365-platform.log
          grep -Fx 'OS_FAMILY=rhel' /tmp/lmr365-platform.log
          grep -Fx 'SMTP_PORT=2526' /tmp/lmr365-platform.log
          grep -Fx 'CHANGES_APPLIED=no' /tmp/lmr365-platform.log
          python3 -m py_compile linux/platform-compat.py linux/m365_xoauth2_transport.py linux/audit-existing-smtp.py
          python3 linux/m365_xoauth2_transport.py --help >/dev/null
          bash linux/install-preserve-postfix-sidecar.sh --check-only --smtp-port 46500 --listen-ip 192.168.40.2 --trusted-network 192.168.40.0/24
          bash linux/network-firewall.sh --validate-only --smtp-port 46500 --listen-ip 192.168.40.2 --trusted-network 192.168.40.0/24
          bash linux/install-postfix-m365-xoauth2.sh --validate-network-only --listen-ip 192.168.40.2 --trusted-network 192.168.40.0/24
          python3 -m unittest discover -v -s tests -p test_platform_compat.py

  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Build portable single EXE x64
        shell: pwsh
        run: dotnet publish src/LinuxMailRelay365/LinuxMailRelay365.csproj -c Release -r win-x64 --self-contained true -p:UseSharedUpdater=false -o out/win-x64
      - name: Windows self-test
        shell: pwsh
        run: |
          # GUI-subsystem EXE must be explicitly waited for; `& exe`
          # does not always set $LASTEXITCODE on Windows.
          $binary = (Resolve-Path ./out/win-x64/LinuxMailRelay365.exe).Path
          $report = Join-Path (Get-Location) 'out/win-x64/selftest-results.txt'
          $testProcess = Start-Process -FilePath $binary -ArgumentList @('--self-test', '--report', $report) -Wait -PassThru
          if (Test-Path -LiteralPath $report) { Get-Content -LiteralPath $report }
          if ($testProcess.ExitCode -ne 0) { throw "Windows self-test failed with exit code $($testProcess.ExitCode)." }
          $files = @(Get-ChildItem ./out/win-x64 -Filter '*.exe')
          if ($files.Count -ne 1) { throw 'Expected exactly one EXE in publish output.' }
      - name: Build portable single EXE ARM64
        shell: pwsh
        run: dotnet publish src/LinuxMailRelay365/LinuxMailRelay365.csproj -c Release -r win-arm64 --self-contained true -p:UseSharedUpdater=false -o out/win-arm64
      - name: Upload preview build (not a stable release)
        uses: actions/upload-artifact@v4
        with:
          name: LinuxMailRelay365-preview-builds
          path: |
            out/win-x64/LinuxMailRelay365.exe
            out/win-arm64/LinuxMailRelay365.exe
          if-no-files-found: error
