name: Rocky Linux SELinux VM acceptance (experimental)

# Standalone for the private SMTP branch and manual diagnosis. The main CI
# invokes this exact workflow for feature/post-rc17-sendmail-v2, so RC18
# publication depends on the same commit's VM result without duplicate jobs.
# Nested KVM availability is not guaranteed; unavailable KVM must fail.
on:
  push:
    branches:
      - feature/private-smtp-auth-tls
      - feature/post-rc19-primary-mailbox-candidate
      - feature/primary-xoauth2-pipe-enforcing
      - feature/primary-xoauth2-pipe-network-enforcing
      - feature/primary-tpm-virtual-device
      - feature/primary-tpm-provider-isolated
      - feature/primary-release-integration
    paths:
      - .github/workflows/rocky-enforcing-vm.yml
      - tests/rocky_vm_*.sh
      - tests/rocky_vm_*.py
      - linux/primary-mailbox-*.py
      - linux/manage-tpm-oauth-key.py
      - linux/m365_xoauth2_transport.py
      - linux/m365_hardware_signer.py
      - linux/inspect-primary-mailbox-selinux.py
      - linux/manage-primary-mailbox-offline.py
      - linux/preview-primary-mailbox-route.py
      - linux/conditional-postfix-transaction.py
      - linux/foreign-mta-config-backup.py
      - linux/restore-foreign-mta-config.py
      - linux/manage-multi-mailbox-proof-timer.py
      - tests/assert_sendmail_v2_export.py
      - tests/rehearse_sendmail_v2_metadata.py
      - linux/manage-rhel-selinux-sidecar-context.py
      - linux/manage-rhel-selinux-port.py
      - linux/smtp-tls-*.py
      - linux/review-smtp-tls-*.py
      - linux/manage-smtp-tls-initial.py
      - linux/manage-smtp-tls-renewal.py
      - linux/systemd/linuxmailrelay365-smtp-tls-*.service
      - linux/stage-smtp-relay-certificate.py
      - linux/check-smtp-relay-certificate.py
  workflow_dispatch:
  workflow_call:
    inputs:
      queue-acceptance:
        description: Verify native Sendmail queue transitions under real SELinux Enforcing
        type: boolean
        default: false
      client-tls-acceptance:
        description: Verify outbound Postfix TLS client certificate in a disposable VM
        type: boolean
        default: false
      primary-mailbox-acceptance:
        description: Verify primary mailbox transaction, runtime review and actual local pipe
        type: boolean
        default: false
      native-tpm-provider-acceptance:
        description: Require the separate Rocky 10 native TPM2 provider and Postfix smoke
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: rocky-selinux-vm-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kvm-host-capability:
    name: Verify nested KVM availability on GitHub-hosted Ubuntu
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Fail fast on experimental proof-timer source syntax
        shell: bash
        run: |
          python3 -m py_compile linux/manage-multi-mailbox-proof-timer.py linux/refresh-multi-mailbox-proof.py linux/audit-oauth-ingress.py linux/audit-oauth-sender-map.py
          python3 -m py_compile tests/rocky_vm_smtp_client_tls_enforcing.py tests/rocky_vm_smtp_tls_renewal.py
          python3 -m py_compile tests/rocky_vm_primary_tpm_device.py linux/manage-tpm-oauth-key.py
          python3 -m py_compile tests/rocky_vm_primary_mailbox_enforcing.py tests/rocky_vm_primary_pipe_enforcing.py tests/rocky_vm_primary_pipe_worker.py linux/manage-primary-mailbox-offline.py linux/primary-mailbox-transaction.py
          # bash -n accepts one script; additional names become positional arguments.
          for script in tests/rocky_vm_multi_proof_timer_enforcing.sh tests/rocky_vm_boot_enforcing.sh tests/rocky_vm_sendmail_systemd_enforcing.sh; do
            bash -n "$script" || exit 1
          done
          python3 -m py_compile linux/foreign-mta-config-backup.py linux/restore-foreign-mta-config.py tests/rocky_vm_sendmail_product_restore.py
          python3 -m py_compile linux/inspect-mail-queue.py tests/smoke_native_sendmail_queue_preview.py
      - name: Inspect kernel KVM and perform real KVM ioctl
        shell: bash
        run: bash tests/rocky_vm_kvm_probe.sh
      - name: Boot official checksum-verified Rocky 9.9 VM and verify SELinux Enforcing
        shell: bash
        env:
          LMR365_KVM_VTPM_ACCEPTANCE: ${{ github.ref_name == 'feature/primary-tpm-virtual-device' || github.ref_name == 'feature/primary-tpm-provider-isolated' }}
          LMR365_KVM_QUEUE_ACCEPTANCE: ${{ inputs.queue-acceptance || false }}
          LMR365_KVM_PRIMARY_MAILBOX_ACCEPTANCE: ${{ inputs.primary-mailbox-acceptance || github.ref_name == 'feature/post-rc19-primary-mailbox-candidate' || github.ref_name == 'feature/primary-xoauth2-pipe-enforcing' || github.ref_name == 'feature/primary-xoauth2-pipe-network-enforcing' || github.ref_name == 'feature/primary-release-integration' }}
          LMR365_KVM_CLIENT_TLS_ACCEPTANCE: ${{ inputs.client-tls-acceptance || github.ref_name == 'feature/post-rc19-primary-mailbox-candidate' || github.ref_name == 'feature/primary-release-integration' }}
        run: bash tests/rocky_vm_boot_enforcing.sh

  kvm-native-tpm-provider:
    name: Rocky 10.3 native OpenSSL TPM2 provider acceptance (swtpm)
    if: inputs.native-tpm-provider-acceptance || github.ref_name == 'feature/primary-tpm-virtual-device' || github.ref_name == 'feature/primary-tpm-provider-isolated' || github.ref_name == 'feature/primary-release-integration' || github.ref_name == 'feature/post-rc19-primary-mailbox-candidate'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Check fixture syntax
        shell: bash
        run: |
          bash -n tests/rocky_vm_boot_enforcing.sh
          python3 -m py_compile tests/rocky_vm_primary_tpm_device.py linux/manage-tpm-oauth-key.py
      - name: Boot Rocky 10.3 and require native TPM2 provider PS256
        shell: bash
        env:
          LMR365_KVM_ROCKY_MAJOR: '10'
          LMR365_KVM_VTPM_ACCEPTANCE: 'true'
          LMR365_KVM_VTPM_PROVIDER_REQUIRED: 'true'
        run: bash tests/rocky_vm_boot_enforcing.sh
