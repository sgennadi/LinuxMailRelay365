name: Postfix offline CLI VM acceptance
on:
  pull_request:
    paths:
      - '.github/workflows/postfix-rc14-systemd-vm-cli.yml'
      - 'linux/conditional-postfix-transaction.py'
      - 'linux/inspect-conditional-postfix-activation.py'
      - 'linux/manage-conditional-postfix-offline.py'
      - 'linux/manage-custom-relay.py'
      - 'linux/manage-google-relay.py'
      - 'linux/stage-conditional-postfix-maps.py'
      - 'tests/smoke_rc14_systemd_vm_cli.sh'
      - 'tests/rc14_namespace_starttls_sink.py'
  push:
    branches: [test/postfix-rc14-pr-ci]
    paths:
      - '.github/workflows/postfix-rc14-systemd-vm-cli.yml'
      - 'linux/conditional-postfix-transaction.py'
      - 'linux/inspect-conditional-postfix-activation.py'
      - 'linux/manage-conditional-postfix-offline.py'
      - 'linux/manage-custom-relay.py'
      - 'linux/manage-google-relay.py'
      - 'linux/stage-conditional-postfix-maps.py'
      - 'tests/smoke_rc14_systemd_vm_cli.sh'
      - 'tests/rc14_namespace_starttls_sink.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rc14-offline-vm-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  hosted-postfix-vm:
    name: Offline Postfix CLI on Ubuntu systemd VM
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Check disposable GitHub-hosted guest and install native Postfix
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$(cat /proc/1/comm)" = systemd
          systemd-detect-virt --vm
          failure="$(dpkg-query -W -f='${db:Status-Status}' postfix 2>/dev/null || true)"
          test "$failure" != installed
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=25 update -qq
          printf 'postfix postfix/main_mailer_type select Internet Site\npostfix postfix/mailname string mail.local.invalid\n' | sudo debconf-set-selections
          sudo env DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=25 install -y -qq postfix openssl ca-certificates iproute2
          sudo systemctl stop postfix.service postfix@-.service
      - name: Exercise unmodified CLI and native Postfix on isolated synthetic veth
        run: |
          sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT,RUNNER_TEMP bash tests/smoke_rc14_systemd_vm_cli.sh
